[package]
name = "freezemon"
version = "1.0.0"
edition = "2024"
description = "External freeze monitor for Dark Souls III (ETW, nothing injected)"
license = "MIT"
publish = false

[dependencies]
sha2 = "0.10"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
]

[profile.release]
codegen-units = 1
lto = "fat"
